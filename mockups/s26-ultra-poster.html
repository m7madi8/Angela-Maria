<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Angela-Maria — Samsung Galaxy S26 Ultra mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500&family=Fraunces:opsz,wght@9..144,300&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:2400px;height:3600px;overflow:hidden;font-family:'Hanken Grotesk',system-ui,sans-serif}
  .poster{
    position:relative;width:2400px;height:3600px;
    background:
      radial-gradient(ellipse 90% 70% at 15% 12%, rgba(125,134,104,.22) 0%, transparent 55%),
      radial-gradient(ellipse 75% 55% at 88% 78%, rgba(105,81,62,.18) 0%, transparent 50%),
      radial-gradient(ellipse 120% 80% at 50% 105%, rgba(36,56,44,.35) 0%, transparent 45%),
      linear-gradient(165deg, #1a2820 0%, #24382c 28%, #292a27 62%, #1f2a24 100%);
    color:#f2f0e8;
  }
  .grain{
    position:absolute;inset:0;opacity:.06;pointer-events:none;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  .top{
    position:absolute;left:0;right:0;top:0;padding:120px 140px 0;
    display:flex;justify-content:space-between;align-items:flex-start;
  }
  .brand{font:300 clamp(3rem,4vw,4.5rem)/1 'Fraunces',Georgia,serif;letter-spacing:-.03em;opacity:.95}
  .meta{text-align:right;font-size:28px;font-weight:300;letter-spacing:.18em;text-transform:uppercase;color:rgba(232,229,220,.55);line-height:1.5}
  .meta strong{display:block;font-weight:500;color:rgba(232,229,220,.82);letter-spacing:.12em;margin-bottom:.35em}
  .stage{
    position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
    width:1040px;height:2100px;perspective:2400px;
  }
  .device-wrap{
    position:relative;width:100%;height:100%;
    transform:rotateX(7deg) rotateY(-11deg);
    transform-style:preserve-3d;
    filter:drop-shadow(-40px 80px 90px rgba(0,0,0,.55)) drop-shadow(0 30px 60px rgba(0,0,0,.35));
  }
  .device{
    position:absolute;inset:0;border-radius:92px;padding:18px;
    background:linear-gradient(145deg,#5a5d62 0%,#3a3d42 18%,#2b2e33 45%,#1a1c20 78%,#4a4d52 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.35),
      inset 0 -2px 8px rgba(0,0,0,.45),
      0 0 0 1px rgba(255,255,255,.08);
  }
  .device::before{
    content:"";position:absolute;inset:10px;border-radius:84px;pointer-events:none;
    background:linear-gradient(160deg,rgba(255,255,255,.14) 0%,transparent 35%,transparent 65%,rgba(255,255,255,.06) 100%);
  }
  .screen{
    position:relative;width:100%;height:100%;border-radius:74px;overflow:hidden;
    background:#24382c;
    box-shadow:inset 0 0 0 2px rgba(0,0,0,.65);
  }
  .screen img{display:block;width:100%;height:100%;object-fit:cover;object-position:top center}
  .island{
    position:absolute;top:22px;left:50%;transform:translateX(-50%);
    width:46px;height:46px;border-radius:50%;z-index:3;
    background:radial-gradient(circle at 35% 30%,#1a1a1a 0%,#000 70%);
    box-shadow:0 0 0 3px #0a0a0a, inset 0 0 8px rgba(255,255,255,.08);
  }
  .island::after{
    content:"";position:absolute;right:8px;top:50%;transform:translateY(-50%);
    width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#2a3340,#0a0e14);
  }
  .btn-r{position:absolute;right:-4px;top:420px;width:6px;height:140px;border-radius:0 4px 4px 0;background:linear-gradient(90deg,#3d4045,#565a60)}
  .btn-l1{position:absolute;left:-4px;top:360px;width:6px;height:88px;border-radius:4px 0 0 4px;background:linear-gradient(270deg,#3d4045,#565a60)}
  .btn-l2{position:absolute;left:-4px;top:470px;width:6px;height:88px;border-radius:4px 0 0 4px;background:linear-gradient(270deg,#3d4045,#565a60)}
  .spen{
    position:absolute;left:50%;bottom:-28px;transform:translateX(-50%);
    width:18px;height:120px;border-radius:0 0 8px 8px;
    background:linear-gradient(180deg,#4a4d52,#2a2c30);
    box-shadow:0 8px 20px rgba(0,0,0,.35);
  }
  .glow{
    position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);
    width:1400px;height:1400px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle, rgba(125,134,104,.16) 0%, transparent 62%);
  }
  .foot{
    position:absolute;left:140px;right:140px;bottom:110px;
    display:flex;justify-content:space-between;align-items:flex-end;gap:2rem;
  }
  .tagline{max-width:920px;font:300 42px/1.45 'Fraunces',Georgia,serif;letter-spacing:-.02em;color:rgba(242,240,232,.88)}
  .tagline em{font-style:italic;color:rgba(184,182,174,.9)}
  .url{font-size:26px;font-weight:500;letter-spacing:.08em;color:rgba(125,134,104,.95);white-space:nowrap}
  .line{
    position:absolute;left:140px;right:140px;bottom:280px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(232,229,220,.22),transparent);
  }
</style>
</head>
<body>
<div class="poster">
  <div class="grain" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>
  <header class="top">
    <div class="brand">Angela-Maria</div>
    <div class="meta">
      <strong>Mobile experience</strong>
      Samsung Galaxy S26 Ultra
    </div>
  </header>
  <div class="stage">
    <div class="device-wrap">
      <div class="device">
        <div class="btn-l1" aria-hidden="true"></div>
        <div class="btn-l2" aria-hidden="true"></div>
        <div class="btn-r" aria-hidden="true"></div>
        <div class="screen">
          <div class="island" aria-hidden="true"></div>
          <img src="hero-mobile.png" width="984" height="2064" alt="Angela-Maria website hero on mobile">
        </div>
      </div>
      <div class="spen" aria-hidden="true"></div>
    </div>
  </div>
  <div class="line" aria-hidden="true"></div>
  <footer class="foot">
    <p class="tagline">Yoga, breath &amp; movement — <em>private sessions, workshops &amp; online courses.</em></p>
    <span class="url">angela-eight.vercel.app</span>
  </footer>
</div>
</body>
</html>
